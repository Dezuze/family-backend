name: Production Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
      - name: Run Backend Tests
        run: |
          cd Backend
          python manage.py test
        env:
          DJANGO_SECRET_KEY: 'ci-test-key'
          DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1'

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install Dependencies
        run: |
          cd Frontend
          npm ci --legacy-peer-deps
      - name: Run Frontend Tests
        run: |
          cd Frontend
          npm test
      - name: Build Frontend (Production Check)
        run: |
          cd Frontend
          npm run build
        env:
          NODE_ENV: production

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercase repository owner
        id: owner
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/family-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/family-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "infra/production/docker-compose.yml,infra/production/traefik/traefik.yml,infra/management/docker-compose.yml"
          target: "~/app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: OWNER_LC,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            cd ~/app
            echo "OWNER_LC=${OWNER_LC}" > .env_deploy
            # Ensure .env exists, or warn
            if [ ! -f .env ]; then
              echo "WARNING: .env file missing on server!"
              # You might want to create a dummy one or fail here
              # touch .env 
            fi
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
            mkdir -p ~/app/infra/production/traefik/letsencrypt ~/management ~/management/portainer_data
            docker compose -p app -f infra/production/docker-compose.yml --env-file .env --env-file .env_deploy config >/dev/null
            docker compose -p app -f infra/production/docker-compose.yml --env-file .env --env-file .env_deploy up -d --remove-orphans
            # Trigger immediate image check/update so production refreshes right after successful image push.
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v ~/.docker/config.json:/config.json:ro \
              containrrr/watchtower \
              --run-once \
              --cleanup \
              --label-enable
            docker compose -p app -f infra/production/docker-compose.yml exec -T backend python manage.py migrate --noinput || echo "Migrations failed, check logs"
            docker compose -p app -f infra/production/docker-compose.yml ps
            docker compose -p app -f infra/production/docker-compose.yml exec -T backend curl -fsS http://localhost:8000/health/ >/dev/null

            # Keep Portainer management stack source-controlled from this repository.
            cp ~/app/infra/management/docker-compose.yml ~/management/docker-compose.yml
            cd ~/management
            docker compose config >/dev/null
            docker compose up -d --remove-orphans portainer

            cd ~/app
            docker system prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
