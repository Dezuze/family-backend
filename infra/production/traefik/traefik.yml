api:
  dashboard: false
  insecure: false

log:
  level: INFO

accessLog:
  bufferingSize: 100

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        options: default

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: app_web

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true

certificatesResolvers:
  myresolver:
    acme:
      email: kollamparampilkudumbam@gmail.com
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web